name: CI

on:
  push:
  pull_request:

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run hygiene checks
        run: bash scripts/hygiene.sh

  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    needs: hygiene
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      NODE_ENV: test
      PORT: 3001
      MONGODB_URI: mongodb://127.0.0.1:27017/movforyou
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run test suite
        run: npm test

      - name: Validate server syntax
        run: node --check server/server.js

      - name: Smoke test app health endpoint
        run: |
          npm start > server.log 2>&1 &
          APP_PID=$!
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3001/api/health > health.json; then
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:3001/api/health | grep -q '"status":"online"'
          kill $APP_PID || true

  # ---------------------------------------------------------------------------
  # M5 - Containerization: build, smoke test, then push the image to GHCR.
  # Runs only on pushes to main, after build-and-test has passed.
  # ---------------------------------------------------------------------------
  docker:
    name: Build and push image
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Normalize image repository name
        id: image-name
        shell: bash
        run: echo "repository=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build the image
        run: |
          IMAGE=ghcr.io/${{ steps.image-name.outputs.repository }}
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .

      - name: Smoke test the image
        run: |
          IMAGE=ghcr.io/${{ steps.image-name.outputs.repository }}
          docker run -d --name smoke -p 3000:3000 -e JWT_SECRET=ci-test-secret $IMAGE:latest
          for i in $(seq 1 15); do
            curl -fsS http://localhost:3000/api/health && break
            sleep 2
          done
          curl -fsS http://localhost:3000/api/health | grep -q '"status":"online"'
          docker rm -f smoke

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the image
        run: |
          IMAGE=ghcr.io/${{ steps.image-name.outputs.repository }}
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
