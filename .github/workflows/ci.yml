name: CI

on:
  push:
  pull_request:

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run hygiene checks
        run: bash scripts/hygiene.sh

  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    needs: hygiene
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Validate server syntax
        run: node --check server/server.js

      - name: Smoke test app health endpoint
        run: |
          PORT=3001 MONGODB_URI=mongodb://127.0.0.1:27017/movforyou npm start > server.log 2>&1 &
          APP_PID=$!
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3001/api/health > health.json; then
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:3001/api/health | grep -q '"status":"online"'
          kill $APP_PID || true
