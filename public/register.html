<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join MovForYou | Create Account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    .auth-page {
      min-height: 85vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .auth-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      width: 100%;
      max-width: 460px;
      box-shadow: var(--shadow-lg);
      backdrop-filter: blur(12px);
    }
    .auth-group {
      margin-bottom: 1.1rem;
    }
    .auth-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
    }
    .auth-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      color: #fff;
      font-size: 0.92rem;
      outline: none;
    }
    .auth-group input:focus {
      border-color: var(--accent-gold);
    }
  </style>
</head>
<body>

  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand-logo">
        <div class="logo-badge"><i class="fa-solid fa-play"></i></div>
        <div class="brand-name">Mov<span>ForYou</span></div>
      </a>
      <div class="nav-actions">
        <button id="themeToggleBtn" class="theme-btn"><i class="fa-solid fa-sun"></i></button>
      </div>
    </div>
  </header>

  <div class="auth-page">
    <div class="auth-card">
      <div style="text-align: center; margin-bottom: 2rem;">
        <div class="logo-badge" style="margin: 0 auto 1rem; width: 50px; height: 50px; font-size: 1.5rem;"><i class="fa-solid fa-play"></i></div>
        <h2 style="font-size: 1.6rem; font-weight: 800;">Create Your Account</h2>
        <p style="color: var(--text-dim); font-size: 0.88rem; margin-top: 0.2rem;">Track movies, write reviews & build your dream watchlist</p>
      </div>

      <form id="registerForm">
        <div class="auth-group">
          <label for="regUsername">Username</label>
          <input type="text" id="regUsername" placeholder="e.g. CinemaBuff" required minlength="3">
        </div>

        <div class="auth-group">
          <label for="regEmail">Email Address</label>
          <input type="email" id="regEmail" placeholder="you@example.com" required>
        </div>

        <div class="auth-group">
          <label for="regPassword">Password</label>
          <input type="password" id="regPassword" placeholder="Minimum 6 characters" required minlength="6">
        </div>

        <div class="auth-group">
          <label for="regConfirmPassword">Confirm Password</label>
          <input type="password" id="regConfirmPassword" placeholder="Re-enter password" required minlength="6">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.6rem; padding: 0.8rem;">
          <i class="fa-solid fa-user-plus"></i> Join MovForYou
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.8rem; font-size: 0.88rem; color: var(--text-dim);">
        Already have an account? <a href="login.html" style="color: var(--accent-gold); font-weight: 700;">Sign In</a>
      </div>
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
