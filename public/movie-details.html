<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Details | MovForYou</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    .details-hero {
      position: relative;
      min-height: 480px;
      background-size: cover;
      background-position: center top;
      display: flex;
      align-items: flex-end;
      padding: 3rem 0;
      margin-bottom: 2.5rem;
    }
    .details-backdrop-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(7, 9, 14, 0.4) 0%, rgba(7, 9, 14, 0.85) 60%, var(--bg-primary) 100%);
    }
    .movie-details-grid {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 2.5rem;
      position: relative;
      z-index: 2;
    }
    .details-poster-card {
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border-color);
      aspect-ratio: 2 / 3;
      background: #000;
    }
    .details-poster-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .badge-genre {
      background: rgba(245, 158, 11, 0.15);
      color: var(--accent-gold);
      border: 1px solid rgba(245, 158, 11, 0.3);
      padding: 0.25rem 0.75rem;
      border-radius: var(--radius-full);
      font-size: 0.8rem;
      font-weight: 700;
      display: inline-block;
      margin-right: 0.4rem;
      margin-bottom: 0.4rem;
    }
    .cast-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 0.35rem 0.8rem;
      border-radius: var(--radius-full);
      font-size: 0.82rem;
      margin: 0.25rem;
    }
    .review-form-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 1.5rem;
      margin: 2rem 0;
    }
    .star-rating-input {
      display: flex;
      gap: 0.4rem;
      font-size: 1.5rem;
      cursor: pointer;
      margin: 0.5rem 0 1rem;
    }
    .star-rating-input i {
      color: #64748b;
      transition: color 0.15s ease;
    }
    .review-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 1.25rem;
      margin-bottom: 1rem;
    }
    .review-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }
    .reviewer-info {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }
    .active-star { color: #fbbf24; }
    .dim-star { color: #475569; }
    .btn-delete-review {
      background: none;
      border: none;
      color: var(--accent-rose);
      font-size: 0.78rem;
      cursor: pointer;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>

  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand-logo">
        <div class="logo-badge"><i class="fa-solid fa-play"></i></div>
        <div class="brand-name">Mov<span>ForYou</span></div>
      </a>
      <nav>
        <ul class="nav-menu">
          <li><a href="index.html" class="nav-link"><i class="fa-solid fa-house"></i> Home</a></li>
          <li><a href="movies.html" class="nav-link active"><i class="fa-solid fa-film"></i> Movies</a></li>
          <li><a href="watchlist.html" class="nav-link"><i class="fa-solid fa-bookmark"></i> Watchlist</a></li>
          <li><a href="favorites.html" class="nav-link"><i class="fa-solid fa-heart"></i> Favorites</a></li>
          <li><a href="dashboard.html" class="nav-link"><i class="fa-solid fa-chart-pie"></i> Dashboard</a></li>
        </ul>
      </nav>
      <div class="nav-actions">
        <button id="themeToggleBtn" class="theme-btn"><i class="fa-solid fa-sun"></i></button>
        <div id="navUserContainer"></div>
      </div>
    </div>
  </header>

  <!-- Movie Details Hero & Backdrop -->
  <section id="detailsBackdrop" class="details-hero">
    <div class="details-backdrop-overlay"></div>
    <div class="container">
      <div class="movie-details-grid">
        <!-- Poster -->
        <div class="details-poster-card">
          <img id="moviePosterImg" src="" alt="Movie Poster">
        </div>

        <!-- Metadata & Actions -->
        <div>
          <div id="movieGenres" style="margin-bottom: 0.75rem;"></div>
          <h1 id="movieTitle" style="font-size: 2.8rem; font-weight: 800; line-height: 1.15; margin-bottom: 0.5rem;">Movie Title</h1>
          
          <div style="display: flex; gap: 1.2rem; align-items: center; margin-bottom: 1.2rem; font-size: 0.95rem; color: var(--text-muted); flex-wrap: wrap;">
            <span><i class="fa-solid fa-calendar"></i> <span id="movieYear">2024</span></span>
            <span><i class="fa-solid fa-clock"></i> <span id="movieRuntime">120 min</span></span>
            <span><i class="fa-solid fa-language"></i> <span id="movieLanguage">English</span></span>
            <span style="color: #fbbf24; font-weight: 700;"><i class="fa-solid fa-star"></i> <span id="movieImdbRating">8.5</span> IMDb</span>
            <span id="communityRating" style="color: var(--accent-cyan); font-weight: 600;"></span>
          </div>

          <!-- Watchlist Action Controls -->
          <div style="display: flex; gap: 0.8rem; align-items: center; margin-bottom: 1.8rem; flex-wrap: wrap;">
            <select id="watchlistStatusSelect" onchange="handleStatusChange()" style="padding: 0.65rem 1rem; border-radius: var(--radius-md); background: var(--bg-card); color: #fff; border: 1px solid var(--accent-gold); font-weight: 700; outline: none; cursor: pointer;">
              <option value="want_to_watch">➕ Add to: Want to Watch</option>
              <option value="watching">▶️ Watching</option>
              <option value="watched">✅ Watched</option>
              <option value="dropped">❌ Dropped</option>
            </select>

            <button id="detailFavBtn" class="btn btn-secondary"><i class="fa-regular fa-heart"></i> Favorite</button>
            <button id="watchTrailerBtn" class="btn btn-primary" style="display: none;"><i class="fa-solid fa-play"></i> Watch Trailer</button>
          </div>

          <!-- Synopsis -->
          <h3 style="font-size: 1.15rem; font-weight: 700; margin-bottom: 0.4rem;">Storyline</h3>
          <p id="movieDescription" style="color: var(--text-muted); line-height: 1.7; font-size: 1rem; margin-bottom: 1.5rem;"></p>

          <!-- Director & Cast -->
          <div style="margin-bottom: 1rem;">
            <strong style="color: var(--text-dim); font-size: 0.85rem; text-transform: uppercase;">Director:</strong>
            <span id="movieDirector" style="font-weight: 700; margin-left: 0.4rem;"></span>
          </div>

          <div>
            <strong style="color: var(--text-dim); font-size: 0.85rem; text-transform: uppercase; display: block; margin-bottom: 0.4rem;">Starring Cast:</strong>
            <div id="movieCastList" style="display: flex; flex-wrap: wrap;"></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Reviews & Similar Section -->
  <main class="container" style="margin-bottom: 4rem;">
    <div style="display: grid; grid-template-columns: 1.4fr 1fr; gap: 3rem;">
      <!-- Ratings & Reviews Column -->
      <section>
        <h2 style="font-size: 1.45rem; font-weight: 800; margin-bottom: 1rem;"><i class="fa-solid fa-star" style="color: var(--accent-gold);"></i> Community Ratings & Reviews</h2>

        <!-- Submit Review Box -->
        <div class="review-form-card">
          <h3 style="font-size: 1.1rem; font-weight: 700; margin-bottom: 0.2rem;">Leave a Review</h3>
          <p style="font-size: 0.82rem; color: var(--text-dim); margin-bottom: 0.5rem;">Select your star rating and write your thoughts:</p>
          <form id="submitReviewForm">
            <div class="star-rating-input">
              <i class="fa-regular fa-star" data-value="1"></i>
              <i class="fa-regular fa-star" data-value="2"></i>
              <i class="fa-regular fa-star" data-value="3"></i>
              <i class="fa-regular fa-star" data-value="4"></i>
              <i class="fa-regular fa-star" data-value="5"></i>
            </div>
            <textarea id="reviewText" rows="3" placeholder="What did you think of the cinematography, story, or acting?" required style="width: 100%; padding: 0.75rem; border-radius: var(--radius-sm); background: var(--bg-input); border: 1px solid var(--border-color); color: #fff; outline: none; margin-bottom: 0.8rem; font-family: inherit;"></textarea>
            <button type="submit" class="btn btn-primary btn-sm"><i class="fa-solid fa-paper-plane"></i> Post Review</button>
          </form>
        </div>

        <!-- Reviews List -->
        <div id="reviewsList"></div>
      </section>

      <!-- Similar Movies Column -->
      <section>
        <h2 style="font-size: 1.45rem; font-weight: 800; margin-bottom: 1.5rem;"><i class="fa-solid fa-film" style="color: var(--accent-cyan);"></i> More Like This</h2>
        <div id="similarMoviesGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1rem;"></div>
      </section>
    </div>
  </main>

  <div id="trailerModal" class="modal-overlay">
    <div class="modal-box modal-trailer">
      <div class="modal-header" style="background: #000; border-color: rgba(255,255,255,0.1);">
        <h3 id="trailerTitle" class="modal-title" style="color: #fff;"><i class="fa-solid fa-play"></i> Trailer</h3>
        <button class="modal-close" style="color: #fff;"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="video-container">
        <iframe id="trailerIframe" src="" allowfullscreen allow="autoplay; encrypted-media"></iframe>
      </div>
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/movie-details.js"></script>
</body>
</html>
