<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Favorites | MovForYou</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand-logo">
        <div class="logo-badge"><i class="fa-solid fa-play"></i></div>
        <div class="brand-name">Mov<span>ForYou</span></div>
      </a>
      <nav>
        <ul class="nav-menu">
          <li><a href="index.html" class="nav-link"><i class="fa-solid fa-house"></i> Home</a></li>
          <li><a href="movies.html" class="nav-link"><i class="fa-solid fa-film"></i> Movies</a></li>
          <li><a href="watchlist.html" class="nav-link"><i class="fa-solid fa-bookmark"></i> Watchlist</a></li>
          <li><a href="favorites.html" class="nav-link active"><i class="fa-solid fa-heart"></i> Favorites</a></li>
          <li><a href="dashboard.html" class="nav-link"><i class="fa-solid fa-chart-pie"></i> Dashboard</a></li>
        </ul>
      </nav>
      <div class="nav-actions">
        <button title="button" type="button" id="themeToggleBtn" class="theme-btn"><i class="fa-solid fa-sun"></i></button>
        <div id="navUserContainer"></div>
      </div>
    </div>
  </header>

  <main class="container" style="margin: 2.5rem auto 4rem;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
      <div>
        <h1 style="font-size: 2rem; font-weight: 800;"><i class="fa-solid fa-heart" style="color: var(--accent-rose);"></i> Favorite Movies</h1>
        <p style="color: var(--text-dim); font-size: 0.9rem;">Your handpicked hall of fame</p>
      </div>
      <span id="favCount" style="font-size: 0.9rem; font-weight: 700; color: var(--accent-gold);"></span>
    </div>

    <div id="favoritesGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1.5rem;"></div>

    <div id="favoritesEmpty" style="display: none; text-align: center; padding: 5rem 1rem;">
      <div style="font-size: 3.5rem; color: var(--accent-rose); margin-bottom: 1rem;"><i class="fa-regular fa-heart"></i></div>
      <h3 style="font-size: 1.4rem; font-weight: 700;">No favorites saved yet</h3>
      <p style="color: var(--text-dim); margin: 0.5rem 0 1.5rem;">Click the heart icon on any movie card to pin it to your favorites!</p>
      <a href="movies.html" class="btn btn-primary">Discover Movies</a>
    </div>
  </main>

  <div id="toastContainer" class="toast-container"></div>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/favorites.js"></script>
</body>
</html>
