services:
  app:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      - db
    environment:
      - PORT=3000
      - MONGODB_URI=mongodb://db:27017/movforyou
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in your .env}

  db:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data: